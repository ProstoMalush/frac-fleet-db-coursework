services:
  db:
    image: postgres:15
    container_name: frac-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${PG_PORT:-5430}:5432"
    volumes:
      - frac_fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frac_fleet_pgdata:
